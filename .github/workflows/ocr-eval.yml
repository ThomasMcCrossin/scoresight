# Measure ScoreSight's OCR (the Tesseract pipeline in src/tesseract.py, with
# every bundled model) on the committed datasets of real and synthetic
# scoreboard crops, and fail if exact-match accuracy drops by more than 2
# points against the committed baseline. Runs on pull requests that can change
# recognition, and manually. See docs/development/ocr-eval.md.
name: OCR eval

on:
  pull_request:
    paths:
      - src/tesseract.py
      - src/defaults.py
      - src/text_detection_target.py
      - tesseract/**
      - ocr_eval/**
      - requirements.txt
      - .github/workflows/ocr-eval.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tesseract:
    name: Tesseract vs. baseline
    # the baseline (ocr_eval/baselines/tesseract.json) was made on Linux with
    # requirements.txt's tesserocr wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show versions
        run: python -c "import tesserocr; print('Tesseract', tesserocr.tesseract_version().splitlines()[0])"

      - name: Validate the datasets
        run: >-
          python -m ocr_eval validate --strict-licenses
          textocr_scoreboards synthetic_7seg commons_scoreboards

      - name: Run the Tesseract pipeline on the datasets
        env:
          LABEL: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -m ocr_eval run
          --dataset textocr_scoreboards --dataset synthetic_7seg
          --dataset commons_scoreboards
          --engine tesseract --label "$LABEL" --quiet --out ocr-eval-results

      - name: Compare with the baseline
        run: >-
          python -m ocr_eval compare
          ocr_eval/baselines/tesseract.json ocr-eval-results/results.json
          --max-drop 0.02 --require-all --markdown ocr-eval-results/comparison.md

      # commons_scoreboards has its own baseline file, so that its labels can
      # be corrected (python -m ocr_eval review) without touching tesseract.json
      - name: Compare with the commons_scoreboards baseline
        if: success() || failure()
        run: >-
          python -m ocr_eval compare
          ocr_eval/baselines/tesseract-commons.json ocr-eval-results/results.json
          --max-drop 0.02 --require-all
          --markdown ocr-eval-results/comparison-commons.md

      - name: Write the job summary
        if: always()
        run: |
          for file in ocr-eval-results/comparison.md ocr-eval-results/comparison-commons.md ocr-eval-results/report.md; do
            if [ -f "$file" ]; then
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-eval-results
          path: ocr-eval-results/
          if-no-files-found: ignore
