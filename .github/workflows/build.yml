# Build, smoke-test and package ScoreSight for every platform.
#
# Runs on pull requests that change the packaging, on demand (Actions > Build >
# Run workflow), and from release.yml for release tags. Packages are uploaded as
# workflow artifacts named after the file they contain:
#   scoresight-<version>-windows-x64-setup.exe
#   scoresight-<version>-windows-x64-portable.zip
#   scoresight-<version>-macos-arm64.dmg
#   scoresight-<version>-macos-x64.dmg
#   scoresight-<version>-linux-x64.tar.gz
# <version> is src/version.py's version, plus "-<short commit>" unless this is a
# release build. Release builds sign and notarize the macOS app when the Apple
# secrets are configured; every other build (including forks) is unsigned.
name: Build

on:
  workflow_call:
    inputs:
      release:
        description: Release build (exact version in file names; sign and notarize macOS if the secrets exist)
        type: boolean
        default: false
      debug:
        description: Windows console build
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE:
        description: Base64-encoded Developer ID Application certificate (.p12)
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_APP_DEVELOPER_ID:
        description: 'Signing identity, e.g. "Developer ID Application: Name (TEAMID)"'
        required: false
      APPLE_DEVELOPER_ID_USER:
        description: Apple ID used for notarization
        required: false
      APPLE_DEVELOPER_ID_PASSWORD:
        description: App-specific password of that Apple ID
        required: false
      APPLE_DEVELOPER_ID_TEAM:
        required: false
  workflow_dispatch:
    inputs:
      release:
        description: Release build (exact version in file names; sign and notarize macOS if the secrets exist)
        type: boolean
        default: false
      debug:
        description: Windows console build
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/build.yml
      - scoresight.spec
      - scoresight.iss
      - entitlements.plist
      - requirements.txt
      - requirements-win.txt
      - requirements-mac.txt
      - requirements-build.txt
      - scripts/ci/**
      - src/main.py
      - src/resource_path.py
      - src/version.py
      - src/win32DeviceEnum/**

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            executable: dist/scoresight/scoresight.exe
          - target: macos-arm64
            runner: macos-latest
            executable: dist/ScoreSight.app/Contents/MacOS/scoresight
          - target: macos-x64
            # the last Intel macOS image; GitHub retires it in fall 2027
            runner: macos-15-intel
            executable: dist/ScoreSight.app/Contents/MacOS/scoresight
          - target: linux-x64
            # The build machine's glibc is the oldest the app runs on: Ubuntu
            # 22.04 has glibc 2.35 (PySide6 6.12 needs 2.34). The image is
            # supported until April 2027; move to a manylinux_2_34 container
            # or ubuntu-24.04 (glibc 2.39) before then.
            runner: ubuntu-22.04
            executable: dist/scoresight/scoresight
    env:
      # Secrets can't be used in `if:` conditions, so decide here.
      SIGN_MACOS: ${{ inputs.release && startsWith(matrix.target, 'macos-') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_APP_DEVELOPER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        # What the bundled Qt links against; also needed by the smoke test.
        # PyInstaller bundles only the libraries it finds here: without the
        # xcb-util ones (not on the runner image), the app can't start on an
        # X11 desktop that lacks them ("xcb-cursor0 or libxcb-cursor0 is
        # needed to load the Qt xcb platform plugin").
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        shell: bash
        run: |
          requirements=(-r requirements.txt -r requirements-build.txt)
          case "$RUNNER_OS" in
            Windows) requirements+=(-r requirements-win.txt) ;;
            macOS) requirements+=(-r requirements-mac.txt) ;;
          esac
          python -m pip install "${requirements[@]}"

      - name: Version
        id: version
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--sha "$COMMIT")
          if [ "$RELEASE" = "true" ]; then args+=(--release); fi
          python scripts/ci/versioning.py github-output "${args[@]}"

      - name: Build the camera enumerator
        if: runner.os == 'Windows'
        working-directory: src/win32DeviceEnum
        run: python setup.py build_ext --inplace

      - name: Import the Apple signing certificate
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # put the build keychain first in the search list (one path per word)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Build with PyInstaller
        shell: bash
        env:
          # the spec signs with this identity when it is set (ad-hoc otherwise)
          APPLE_APP_DEVELOPER_ID: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_APP_DEVELOPER_ID || '' }}
          DEBUG_BUILD: ${{ inputs.debug && runner.os == 'Windows' }}
        run: |
          spec_args=()
          if [ "$DEBUG_BUILD" = "true" ]; then spec_args+=(-- --debug); fi
          python -m PyInstaller --clean --noconfirm scoresight.spec "${spec_args[@]}"

      - name: Smoke test (--self-test)
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: python scripts/ci/smoke_test.py "$EXECUTABLE"

      - name: Notarize the app
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_DEVELOPER_ID_USER: ${{ secrets.APPLE_DEVELOPER_ID_USER }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID_TEAM: ${{ secrets.APPLE_DEVELOPER_ID_TEAM }}
        run: |
          codesign --verify --deep --strict --verbose=2 dist/ScoreSight.app
          ditto -c -k --keepParent dist/ScoreSight.app "$RUNNER_TEMP/ScoreSight.zip"
          bash scripts/ci/notarize_macos.sh "$RUNNER_TEMP/ScoreSight.zip"
          xcrun stapler staple dist/ScoreSight.app
          spctl --assess --type execute --verbose=2 dist/ScoreSight.app

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        env:
          DMG: dist/scoresight-${{ steps.version.outputs.label }}-${{ matrix.target }}.dmg
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/ScoreSight.app "$staging/ScoreSight.app"
          ln -s /Applications "$staging/Applications"
          # hdiutil sometimes fails with "Resource busy" on hosted runners
          for attempt in 1 2 3; do
            if hdiutil create -volname ScoreSight -srcfolder "$staging" -fs HFS+ \
                -format UDZO -ov "$DMG"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done

      - name: Sign and notarize the disk image
        if: env.SIGN_MACOS == 'true'
        env:
          DMG: dist/scoresight-${{ steps.version.outputs.label }}-${{ matrix.target }}.dmg
          APPLE_APP_DEVELOPER_ID: ${{ secrets.APPLE_APP_DEVELOPER_ID }}
          APPLE_DEVELOPER_ID_USER: ${{ secrets.APPLE_DEVELOPER_ID_USER }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID_TEAM: ${{ secrets.APPLE_DEVELOPER_ID_TEAM }}
        run: |
          codesign --sign "$APPLE_APP_DEVELOPER_ID" --timestamp "$DMG"
          bash scripts/ci/notarize_macos.sh "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Remove the signing keychain
        if: always() && env.SIGN_MACOS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: scoresight.iss
          # one option per line: the action passes each line to ISCC as one
          # argument (all on one line, ISCC took them as an /O output folder)
          options: |
            /O+
            /DAppVersion=${{ steps.version.outputs.label }}
            /DAppVersionNumeric=${{ steps.version.outputs.numeric }}

      - name: Package (Windows portable zip) and test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          $setup = "dist\scoresight-$env:LABEL-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Inno Setup did not produce $setup" }
          $setup = (Resolve-Path $setup).Path
          Compress-Archive -Path dist\scoresight -DestinationPath "dist\scoresight-$env:LABEL-windows-x64-portable.zip"

          # install for the current user, run the installed app's self-test,
          # then uninstall and check that the files are gone
          $app = Join-Path $env:RUNNER_TEMP "ScoreSight"
          $install = Start-Process $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$app`"")
          if ($install.ExitCode -ne 0) { throw "installer exit code $($install.ExitCode)" }
          python scripts/ci/smoke_test.py "$app\scoresight.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstall = Start-Process "$app\unins000.exe" -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller exit code $($uninstall.ExitCode)" }
          # the uninstaller finishes from a temporary copy of itself
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\scoresight.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\scoresight.exe") { throw "the uninstaller left $app\scoresight.exe behind" }

      - name: Package (Linux archive)
        if: runner.os == 'Linux'
        env:
          LABEL: ${{ steps.version.outputs.label }}
        run: tar -czf "dist/scoresight-$LABEL-linux-x64.tar.gz" -C dist scoresight

      - name: Summary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### $TARGET packages"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in dist/scoresight-*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: scoresight-${{ steps.version.outputs.label }}-windows-x64-setup.exe
          path: dist/scoresight-${{ steps.version.outputs.label }}-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.release && 30 || 7 }}

      - name: Upload the portable zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: scoresight-${{ steps.version.outputs.label }}-windows-x64-portable.zip
          path: dist/scoresight-${{ steps.version.outputs.label }}-windows-x64-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.release && 30 || 7 }}

      - name: Upload the disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: scoresight-${{ steps.version.outputs.label }}-${{ matrix.target }}.dmg
          path: dist/scoresight-${{ steps.version.outputs.label }}-${{ matrix.target }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.release && 30 || 7 }}

      - name: Upload the archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: scoresight-${{ steps.version.outputs.label }}-linux-x64.tar.gz
          path: dist/scoresight-${{ steps.version.outputs.label }}-linux-x64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.release && 30 || 7 }}
